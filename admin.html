<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>招聘看板管理后台</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#172033;background:#f1f5f9}
    *{box-sizing:border-box}body{margin:0}.wrap{max-width:780px;margin:40px auto;padding:0 18px}.card{background:#fff;padding:24px;border-radius:14px;box-shadow:0 4px 20px #0f172a12;margin-bottom:16px}h1,h2{margin-top:0}input,button{font:inherit;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;margin:5px 4px 5px 0}input{min-width:220px}button{background:#2563eb;color:#fff;border-color:#2563eb;cursor:pointer}button.secondary{background:#fff;color:#1e40af}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{background:#eff6ff;padding:18px;border-radius:10px;text-align:center}.metric b{display:block;font-size:28px}.hidden{display:none}.msg{min-height:20px;color:#475569}.error{color:#b91c1c}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top a{color:#2563eb;text-decoration:none}@media(max-width:620px){.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}input{width:100%;min-width:0}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top"><h1>招聘看板管理后台</h1><a href="./">返回公开看板</a></div>
    <section class="card" id="loginPanel">
      <h2>管理员登录</h2>
      <input id="adminUsername" autocomplete="username" placeholder="管理员账号">
      <input id="adminPassword" type="password" autocomplete="current-password" placeholder="密码">
      <button id="loginButton">登录</button>
      <p class="msg" id="loginMessage"></p>
    </section>
    <div id="adminPanel" class="hidden">
      <section class="card">
        <h2>使用概览</h2>
        <div class="stats"><div class="metric"><b id="registered">-</b>注册总人数</div><div class="metric"><b id="active7">-</b>近7天登录</div><div class="metric"><b id="active30">-</b>近30天登录</div></div>
        <p class="msg" id="registrationState"></p>
      </section>
      <section class="card">
        <h2>注册管理</h2>
        <button id="toggleRegistration">暂停注册</button>
        <input id="newInviteCode" type="password" placeholder="新邀请码（至少8位）">
        <button id="rotateInvite">更换邀请码</button>
        <p class="msg" id="settingsMessage"></p>
      </section>
      <section class="card">
        <h2>成员密码重置</h2>
        <input id="memberUsername" placeholder="成员准确账号名">
        <button id="createResetCode">生成一次性重置码</button>
        <p class="msg" id="resetMessage"></p>
      </section>
      <button class="secondary" id="logoutButton">退出管理员后台</button>
    </div>
  </main>
  <script src="sync-config.js"></script>
  <script src="admin-client.js"></script>
</body>
</html>
